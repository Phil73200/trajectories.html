<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Trajectoires corrigées</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;margin:20px}
</style>
</head>
<body>
<h2>SL Hommes - Carrières reconstruites dans le bon sens</h2>
<p>Saison 1 = première saison classée, puis progression chronologique.</p>
<canvas id="chart"></canvas>

<script>
const datasets = [

{

 borderColor:'red',
 borderWidth:3,
 pointRadius:3,
 tension:0.15
},

{
 label:'KRISTOFFERSEN Henrik',
 data:[{'x': 1, 'y': 31.0}, {'x': 2, 'y': 21.0}, {'x': 3, 'y': 3.0}, {'x': 4, 'y': 5.0}, {'x': 5, 'y': 1.0}, {'x': 6, 'y': 2.0}, {'x': 7, 'y': 2.0}, {'x': 8, 'y': 3.0}, {'x': 9, 'y': 1.0}, {'x': 10, 'y': 1.0}, {'x': 11, 'y': 1.0}, {'x': 12, 'y': 1.0}, {'x': 13, 'y': 1.0}, {'x': 14, 'y': 1.0}, {'x': 15, 'y': 1.0}],

 borderWidth:3,

 tension:0.15
},

{
 label:'NOEL Clement',
 data:[{'x': 1, 'y': 634.0}, {'x': 2, 'y': 257.0}, {'x': 3, 'y': 133.0}, {'x': 4, 'y': 61.0}, {'x': 5, 'y': 14.0}, {'x': 6, 'y': 2.0}, {'x': 7, 'y': 1.0}, {'x': 8, 'y': 1.0}, {'x': 9, 'y': 1.0}, {'x': 10, 'y': 1.0}, {'x': 11, 'y': 10.0}, {'x': 12, 'y': 1.0}, {'x': 13, 'y': 1.0}],
 borderColor:'green',
 borderWidth:3,
 pointRadius:3,
 tension:0.15
},

{
 label:'PINHEIRO BRAATHEN Lucas',

 borderWidth:3,
 pointRadius:3,
 tension:0.15
},

];

new Chart(document.getElementById('chart'),{
 type:'line',
 data:{datasets},
 options:{
   parsing:false,
   plugins:{legend:{display:true}},
   scales:{
     x:{
       type:'linear',
       title:{display:true,text:'Saison de carrière'}
     },
     y:{
       reverse:true,
       type:'logarithmic',
       min:1,
       max:1000,
       title:{display:true,text:'Rang mondial'}
     }
   }
 }
});
</script>
</body>
</html>
